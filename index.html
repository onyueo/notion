<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Study | Weekly Partners</title>
  <style>
    /* 노션 Embed 안의 HTML 자체에는 외곽선/바깥 여백/그림자가 전혀 없습니다. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      color: #242424;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main.widget {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0 !important;
      border-radius: 0 !important;
      outline: none;
      box-shadow: none !important;
      background: transparent !important;
    }
    /* 날짜도 카드처럼 둘러싸지 않고 텍스트로만 표시 */
    .date {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 15px;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }
    .date strong { font-size: 16px; }
    .date span { font-size: 12px; color: #777; }
    .rounds {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    /* 핵심: Round 1/2를 감싸던 둥근 네모 테두리도 제거 */
    .round {
      margin: 0;
      padding: 0;
      border: 0 !important;
      border-radius: 0 !important;
      outline: none;
      box-shadow: none !important;
      background: transparent !important;
      min-width: 0;
    }
    .round h2 { margin: 0 0 10px; padding: 0; font-size: 14px; }
    /* 방 사이의 얇은 구분선만 유지: 외곽 테두리가 아님 */
    .room {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 11px 0;
      margin: 0;
      border: 0;
      border-top: 1px solid #ececec;
      background: transparent;
    }
    .room-name { color: #777; font-size: 12px; white-space: nowrap; }
    .people { font-size: 13px; font-weight: 600; text-align: right; }
    @media (max-width: 580px) {
      .rounds { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body>
  <main class="widget">
    <div class="date">
      <strong id="study-date">날짜 계산 중...</strong>
      <span id="week-label"></span>
    </div>
    <section class="rounds" id="rounds" aria-label="짝꿍 및 방 배정"></section>
  </main>

  <script>
    // ★ 변경할 부분 1: Week 1에 해당하는 첫 토요일 (YYYY-MM-DD)
    const FIRST_SATURDAY = "2026-11-14";

    // ★ 변경할 부분 2: 매주 방별 짝꿍. 순서대로 1번, 2번, 3번 방.
    // 5주치 배정을 넣었으며 6주차부터 같은 순서로 반복합니다.
    // 한 주의 첫 배열이 Round 1, 둘째 배열이 Round 2입니다.
    const SCHEDULE = [
      [ // Week 1
        [["Soo", "Joanna"], ["Ella", "Sadie"], ["Jiyoung", "Mina"]],
        [["Soo", "Sadie"], ["Joanna", "Mina"], ["Ella", "Jiyoung"]]
      ],
      [ // Week 2
        [["Soo", "Mina"], ["Sadie", "Jiyoung"], ["Joanna", "Ella"]],
        [["Soo", "Jiyoung"], ["Mina", "Ella"], ["Sadie", "Joanna"]]
      ],
      [ // Week 3
        [["Soo", "Ella"], ["Jiyoung", "Joanna"], ["Mina", "Sadie"]],
        [["Soo", "Joanna"], ["Ella", "Sadie"], ["Jiyoung", "Mina"]]
      ],
      [ // Week 4
        [["Soo", "Sadie"], ["Joanna", "Mina"], ["Ella", "Jiyoung"]],
        [["Soo", "Mina"], ["Sadie", "Jiyoung"], ["Joanna", "Ella"]]
      ],
      [ // Week 5
        [["Soo", "Jiyoung"], ["Mina", "Ella"], ["Sadie", "Joanna"]],
        [["Soo", "Ella"], ["Jiyoung", "Joanna"], ["Mina", "Sadie"]]
      ]
    ];

    // 화면에 표시할 회차명과 방 이름
    const ROUND_NAMES = ["본문 툭튀툭", "LHT"];
    const ROOM_NAMES = ["🥥 coconut", "🥖 baguete", "🥟 mandu"];

    const DAY_MS = 24 * 60 * 60 * 1000;

    // 접속한 사람이 해외에 있어도 한국 기준 날짜를 가져옵니다.
    function koreaTodayUTC() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const get = (type) => Number(parts.find(p => p.type === type).value);
      return Date.UTC(get("year"), get("month") - 1, get("day"));
    }

    function getTargetSaturday() {
      const today = koreaTodayUTC();
      const day = new Date(today).getUTCDay(); // 0=일, 6=토
      const untilSaturday = (6 - day + 7) % 7;
      return today + untilSaturday * DAY_MS;
    }

    function render() {
      const first = Date.parse(FIRST_SATURDAY + "T00:00:00Z");
      if (!Number.isFinite(first) || new Date(first).getUTCDay() !== 6) {
        document.getElementById("study-date").textContent = "FIRST_SATURDAY에 토요일 날짜를 넣어주세요.";
        return;
      }
      const target = Math.max(first, getTargetSaturday());
      const weekNumber = Math.floor((target - first) / (7 * DAY_MS)) + 1;
      const chosen = SCHEDULE[(weekNumber - 1) % SCHEDULE.length];

      const dateLabel = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "UTC", year: "numeric", month: "long", day: "numeric", weekday: "short"
      }).format(new Date(target));
      document.getElementById("study-date").textContent = "📅 " + dateLabel;
      document.getElementById("week-label").textContent = "Week " + weekNumber;

      document.getElementById("rounds").innerHTML = chosen.map((pairs, roundIndex) => `
        <article class="round">
          <h2>${ROUND_NAMES[roundIndex]}</h2>
          ${pairs.map((pair, roomIndex) => `
            <div class="room">
              <span class="room-name">${ROOM_NAMES[roomIndex]}</span>
              <span class="people">${pair[0]} , ${pair[1]}</span>
            </div>
          `).join("")}
        </article>
      `).join("");
    }

    render();
    setInterval(render, 10000); // 열어둔 상태여도 일요일에 자동 갱신
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) render();
    });
  </script>
</body>
</html>
